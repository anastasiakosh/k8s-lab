apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  WELCOME_MSG: "Hello from Kubernetes on MacBook!"
  APP_ENV: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
type: Opaque
stringData:
  API_KEY: "secret-12345"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-pv
spec:
  capacity:
    storage: 50Mi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/k8s-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web-server
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secret
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /www /logs /shared-node
              printf "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\n\r\n<h1>%s</h1><p>Env: %s | Secret loaded!</p>\n" "$WELCOME_MSG" "$APP_ENV" > /www/index.html
              while true; do
                echo "[$(date)] Heartbeat from $(hostname)" | tee -a /logs/app.log > /shared-node/heartbeat.txt
                sleep 5
              done &
              while true; do nc -lk -p 8080 -e cat /www/index.html; done
          volumeMounts:
            - name: logs-vol
              mountPath: /logs
            - name: node-vol
              mountPath: /shared-node
            - name: pv-vol
              mountPath: /data
        - name: log-sidecar
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "mkdir -p /logs && touch /logs/app.log && tail -F /logs/app.log"]
          volumeMounts:
            - name: logs-vol
              mountPath: /logs
      volumes:
        - name: logs-vol
          emptyDir: {}
        - name: node-vol
          hostPath:
            path: /mnt/shared-node
            type: DirectoryOrCreate
        - name: pv-vol
          persistentVolumeClaim:
            claimName: app-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-reader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reader
  template:
    metadata:
      labels:
        app: reader
    spec:
      containers:
        - name: reader
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "while true; do cat /shared-node/heartbeat.txt 2>/dev/null || echo 'Waiting...'; sleep 5; done"]
          volumeMounts:
            - name: node-vol
              mountPath: /shared-node
      volumes:
        - name: node-vol
          hostPath:
            path: /mnt/shared-node
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: web-clusterip
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-clusterip
                port:
                  number: 80
